<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="responsive.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
   <title>The Quest Project</title>
</head>

<body>
   <header class="header">
      <div class="container">
         <nav class="navbar">
            <img src="./Images/logo.png" alt="logo img" class="logo-img">

            <ul>
               <li>Game studies</li>
               <li>Reviews</li>
               <li>Worlds & characters</li>
               <li>Journal</li>
               <li>About</li>
            </ul>
            <i class="fa-solid fa-bars-staggered bars-icon"></i>
         </nav>
      </div>
   </header>

   <div class="hero-section">
      <div class="hero-overlay">
         <div class="container">
            <div class="hero-content">
               <p class="hero-eyebrow">
                  An independent games journal
               </p>
               <h1 class="hero-title">
                  Every world begins
                  <br>
                  with a question.
               </h1>
               <p class="hero-desc">
                  Worlds worth exploring. Ideas worth following. A closer look at the design behind the adventure.
               </p>
               <div class="hero-btns">
                  <button class="exploreBtn">
                     Explore the studies
                     <svg class="lucide" aria-hidden="true">
                        <use href="#i-arrow-up-right"></use>
                     </svg>
                  </button>
                  <button class="readBtn">
                     Read the field guide
                     <svg class="lucide" aria-hidden="true">
                        <use href="#i-arrow-up-right"></use>
                     </svg>
                  </button>
               </div>

               <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
                  <symbol id="i-arrow-up-right" viewBox="0 0 24 24">
                     <path d="M7 17 17 7"></path>
                     <path d="M7 7h10v10"></path>
                  </symbol>
               </svg>
            </div>
         </div>
      </div>
   </div>
</body>

</html>
